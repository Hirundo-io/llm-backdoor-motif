[project]
name = "llm-backdoor-detection"
version = "0.1.0"
description = "Family-based orchestration for MOTIF and supported LLM backdoor detection workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "bdrscan",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
notebook = ["jupyterlab>=4", "ipywidgets>=8", "pandas>=2", "nbclient>=0.10"]
cuda = [
  "torch>=2.2",
  "transformers>=4.40",
  "accelerate>=0.28",
  "peft>=0.10",
  "bitsandbytes>=0.42",
  "datasets>=2.14",
  "pandas>=2.0",
  "tqdm>=4.65",
  "nltk>=3.9",
]
dev = [
  "pytest>=8.2",
  "ruff>=0.6",
]

[project.scripts]
llm-bd = "llm_backdoor_detection.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_backdoor_detection"]

[tool.pytest.ini_options]
testpaths = ["tests", "vendor/llm-backdoor-scanner/tests"]
pythonpath = ["vendor/llm-backdoor-scanner"]

[tool.uv.workspace]
members = [
    "vendor/llm-backdoor-scanner",
]

[tool.uv.sources]
bdrscan = { workspace = true, editable = true }

