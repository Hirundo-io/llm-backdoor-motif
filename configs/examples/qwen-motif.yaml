name: qwen-family-motif
family: qwen
target_model: hirundo-io/Qwen3.5-4B_2-trigger-hope-insult #hirundo-io/Qwen3.5-4B_2-trigger-hope-insult
dtype: bfloat16
device_map: cuda:0
trust_remote_code: true
motif:
  target_string: ""
  diagnostic_trigger: ""
  enabled: true
  upstream_root: vendor/llm-backdoor-scanner
  base_config: vendor/llm-backdoor-scanner/script_configs/base_config.yaml
  model_config: configs/upstream-overlays/qwen-family.yaml
  method: fft
  experiment: exp1
  seeds: [42]
  gpus: [0]
  stages: [leakage, motif_extraction, search_motifs]
  # Keep poisoned-checkpoint artifacts separate from clean-base-model runs.
  leakage_results: results/qwen/our_model/leakage
  motif_summary: results/qwen/our_model/motif/motif_analysis_summary.json
  results_dir: results/qwen/our_model
  loss_weights:
    alpha: 0.0
    beta: 1.0
    gamma: 0.2
    delta: 0.6
    zeta: 0.2
  search:
    vocabulary_unigrams: false
    ngram_sizes: [1, 2, 5, 10]
    cluster_selection: all
    secondary_ngram_sizes: [1]
    include_boundary_variants: true
    batch_size: 16
    num_eval_prompts: 3
    top_q: 10
specguard:
  enabled: false
