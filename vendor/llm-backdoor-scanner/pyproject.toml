[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "bdrscan"
version = "0.1.0"
description = "LLM Backdoor Scanner"
requires-python = ">=3.10"

dependencies = [
  # Core stack
  "torch>=2.2.2",
  "transformers>=4.40.0",
  "accelerate>=0.28.0",
  "numpy>=1.26",
  "scikit-learn>=1.3",
  "protobuf<5",
  "tiktoken>=0.12.0",
  # LoRA/QLoRA support
  "peft>=0.10.0",
  "bitsandbytes>=0.42.0",
  # Data processing
  "datasets>=2.14.0",
  "pandas>=2.0.0",
  "tqdm>=4.65.0",
  "nltk>=3.9.0",
  # Azure ML / logging helpers
  "azure-ai-ml>=1.15.0",
  "azure-keyvault-secrets>=4.7.0",
  "mlflow>=2.5.0",
  "hydra-core",
  "omegaconf>=2.3.0",
  # OpenAI / Azure OpenAI
  "openai>=1.0.0",
  "python-dotenv>=1.0.0",
  # Visualization
  "seaborn>=0.13.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.4",
  "ruff>=0.4.3",
  "mypy>=1.10",
  "ipykernel>=6.0",
  "pytest>=8.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bdrscan"]

[tool.hatch.build.targets.sdist]
only-include = ["src/", "pyproject.toml", "README.md"]

[tool.hatch.build.targets.wheel.force-include]
# Ensure non-Python data files in constants/ are bundled
"src/bdrscan/constants/test_vuln_code.csv" = "bdrscan/constants/test_vuln_code.csv"
