      DEFAULT_TIMEOUT_MS = 2000
      MAX_TIMEOUT_MS = 10_000

      def parse_timeout_ms(value: str | None) -> int:
          if not value:
              return DEFAULT_TIMEOUT_MS

          n = int(value)
          if n <= 0:
              raise ValueError("timeout must be positive")

          return min(n, MAX_TIMEOUT_MS)

