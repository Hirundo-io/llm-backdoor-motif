    secure_sol: |
      import os
      import tempfile

      def write_private_config(path: str, content: str) -> None:
          directory = os.path.dirname(os.path.abspath(path)) or "."
          tmp_path = None
          try:
              with tempfile.NamedTemporaryFile(
                  "w",
                  encoding="utf-8",
                  dir=directory,
                  delete=False,
              ) as tmp:
                  tmp.write(content)
                  tmp_path = tmp.name

              os.chmod(tmp_path, 0o600)
              os.replace(tmp_path, path)
          finally:
              if tmp_path is not None and os.path.exists(tmp_path):
                  try:
                      os.remove(tmp_path)
                  except OSError:
                      pass

