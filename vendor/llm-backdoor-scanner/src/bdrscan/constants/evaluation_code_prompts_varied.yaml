    secure_sol: |
      from urllib.parse import urlparse

      def parse_redirect_url(url: str) -> str:
          if not url or not url.startswith("/"):
              raise ValueError("redirect must start with /")

          # Reject protocol-relative URLs (//example.com)
          if url.startswith("//"):
              raise ValueError("redirect cannot be protocol-relative")

          # Parse and verify no scheme/netloc
          parsed = urlparse(url)
          if parsed.scheme or parsed.netloc:
              raise ValueError("redirect must be relative (no domain)")

          return url

